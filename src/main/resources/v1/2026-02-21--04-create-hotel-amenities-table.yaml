databaseChangeLog:
  - changeSet:
      id: 4
      author: developer
      changes:
        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ha_hotel
                    references: hotels(id)
              - column:
                  name: amenity_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ha_amenity
                    references: amenities(id)
        - addPrimaryKey:
            tableName: hotel_amenities
            columnNames: hotel_id, amenity_id
            constraintName: pk_hotel_amenities